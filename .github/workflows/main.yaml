name: CI/CD Pipeline

on:
  push:
    branches: ["devOps"]
  pull_request:
    branches: ["devOps"]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd backend/user-service
          npm install
          cd ../goal-service
          npm install
          cd ../daily-log-service
          npm install

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies & build frontend
        run: |
          cd frontend
          npm install
          npm run build

  ecr-push:
    needs: ["backend", "frontend"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/nutritracker-frontend-dev:1.0.${{ github.run_number }}

      - name: Push daily-log-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/daily-log-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/nutritracker-daily-log-service-dev:1.0.${{ github.run_number }}

      - name: Push goal-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/goal-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/nutritracker-goal-service-dev:1.0.${{ github.run_number }}

      - name: Push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/user-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/nutritracker-user-service-dev:1.0.${{ github.run_number }}

      - name: Update Helm values with new image tags
        run: |
          sudo snap install yq
          yq -i '.frontend.image.tag = "1.0.${{ github.run_number }}"' helm/nutri-track/values-dev.yaml
          yq -i '.userService.image.tag = "1.0.${{ github.run_number }}"' helm/nutri-track/values-dev.yaml
          yq -i '.goalService.image.tag = "1.0.${{ github.run_number }}"' helm/nutri-track/values-dev.yaml
          yq -i '.dailyLog.image.tag = "1.0.${{ github.run_number }}"' helm/nutri-track/values-dev.yaml

      - name: Commit and push updated Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/nutri-track/values-dev.yaml
          git commit -m "Update image tags to 1.0.${{ github.run_number }} [skip ci]"
          git push