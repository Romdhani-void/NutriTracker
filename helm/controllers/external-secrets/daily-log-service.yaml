apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: daily-log-service-secret
  namespace: nutri-track
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: daily-log-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nutritracker/dev/daily-log-service