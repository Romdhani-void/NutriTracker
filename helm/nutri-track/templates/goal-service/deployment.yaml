apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.goalService.name }}
  labels:
    app: {{ .Values.goalService.name }}
spec:
  replicas: {{ .Values.goalService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.goalService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.goalService.name }}
    spec:
      containers:
        - name: {{ .Values.goalService.name }}
          image: {{- if .Values.global.imageRegistry }} {{ printf "%s/%s:%s" .Values.global.imageRegistry .Values.goalService.image.repository .Values.goalService.image.tag | quote }} {{- else }} {{ printf "%s:%s" .Values.goalService.image.repository .Values.goalService.image.tag | quote }} {{- end }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.goalService.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.goalService.name }}-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20