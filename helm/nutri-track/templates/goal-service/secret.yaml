{{- $env := .Values.goalService.env | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.goalService.name }}-secret
  labels:
    app: {{ .Values.goalService.name }}
type: Opaque
stringData:
  PORT: {{ .Values.goalService.port | quote }}
  MONGO_URI: {{ required "goalService.env.MONGO_URI is required — set it in values-dev.yaml" $env.MONGO_URI | quote }}
