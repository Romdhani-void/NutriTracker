apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}-frontend
  labels:
    app: {{ .Values.frontend.name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}-frontend
    spec:
      containers:
        - name: frontend
          image: {{- if .Values.global.imageRegistry }} {{ printf "%s/%s:%s" .Values.global.imageRegistry .Values.frontend.image.repository .Values.frontend.image.tag | quote }} {{- else }} {{ printf "%s:%s" .Values.frontend.image.repository .Values.frontend.image.tag | quote }} {{- end }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
