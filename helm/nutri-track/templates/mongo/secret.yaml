{{- if .Values.mongo.enabled }}
{{- $auth := .Values.mongo.auth | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mongo.name }}-secret
  labels:
    app: {{ .Values.mongo.name }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ required "mongo.auth.rootUsername is required — set it in values-dev.yaml" $auth.rootUsername | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "mongo.auth.rootPassword is required — set it in values-dev.yaml" $auth.rootPassword | quote }}
{{- end }}
