apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.userService.service.name }}
  labels:
    app: {{ .Values.userService.name }}
spec:
  type: {{ .Values.userService.service.type | default "ClusterIP" }}
  selector:
    app: {{ .Values.userService.name }}
  ports:
    - name: {{ .Values.userService.service.portName | default "http" }}
      protocol: {{ .Values.userService.service.protocol | default "TCP" }}
      port: {{ .Values.userService.service.port }}
      targetPort: {{ .Values.userService.service.targetPort }}
