{{- $env := .Values.userService.env | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.userService.name }}-secret
  labels:
    app: {{ .Values.userService.name }}
type: Opaque
stringData:
  PORT: {{ .Values.userService.port | quote }}
  MONGO_URI: {{ required "userService.env.MONGO_URI is required — set it in values-dev.yaml" $env.MONGO_URI | quote }}
  TOKEN_EXPIRY_MINUTES: {{ required "userService.env.TOKEN_EXPIRY_MINUTES is required — set it in values-dev.yaml" $env.TOKEN_EXPIRY_MINUTES | quote }}
  SMTP_HOST: {{ required "userService.env.SMTP_HOST is required — set it in values-dev.yaml" $env.SMTP_HOST | quote }}
  SMTP_PORT: {{ required "userService.env.SMTP_PORT is required — set it in values-dev.yaml" $env.SMTP_PORT | quote }}
  SMTP_USER: {{ required "userService.env.SMTP_USER is required — set it in values-dev.yaml" $env.SMTP_USER | quote }}
  SMTP_PASS: {{ required "userService.env.SMTP_PASS is required — set it in values-dev.yaml" $env.SMTP_PASS | quote }}
  EMAIL_FROM: {{ required "userService.env.EMAIL_FROM is required — set it in values-dev.yaml" $env.EMAIL_FROM | quote }}
