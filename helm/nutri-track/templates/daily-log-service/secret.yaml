{{- $env := .Values.dailyLog.env | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dailyLog.name }}-secret
  labels:
    app: {{ .Values.dailyLog.name }}
type: Opaque
stringData:
  PORT: {{ .Values.dailyLog.port | quote }}
  MONGO_URI: {{ required "dailyLog.env.MONGO_URI is required — set it in values-dev.yaml" $env.MONGO_URI | quote }}
  GOAL_SERVICE_URL: {{ required "dailyLog.env.GOAL_SERVICE_URL is required — set it in values-dev.yaml" $env.GOAL_SERVICE_URL | quote }}